name: False positive
description: goalposts flagged a change that is legitimate
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: GP005 }
    validations: { required: true }
  - type: textarea
    id: diff
    attributes:
      label: The diff that was flagged
      description: Minimal diff (remove anything private). Include the finding text.
      render: diff
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why is this change fine? }
